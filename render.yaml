# Render blueprint for the ResolveAI API.
#
# Every value below is non-secret. The six secrets (Supabase URL and
# service-role key, JWT secret, and the provider keys) are marked sync:false
# so Render prompts for them rather than storing them in this file, which is
# committed to a public repository.
services:
  - type: web
    name: resolveai-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: JWT_EXPIRES_IN
        value: 8h
      # --- set these in the Render dashboard, never here ---
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
