<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#5e6ad2" />
    <meta
      name="description"
      content="ResolveAI — proactive AI customer-experience platform. Resolve problems before customers have to ask."
    />
    <title>ResolveAI — Customer Experience Command Center</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!--
      Theme applied before first paint so there is no flash of the wrong theme.
      Reads an explicit choice from localStorage, else follows the OS setting.
      Wrapped in try/catch: private mode and blocked site data both throw here.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('resolveai-theme');
          var dark =
            stored === 'dark' ||
            (stored !== 'light' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {
          /* storage unavailable — fall through to the CSS media default */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
