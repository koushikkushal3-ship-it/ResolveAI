<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#ec3013" />
    <meta
      name="description"
      content="ResolveAI — proactive AI customer-experience platform. Resolve problems before customers have to ask."
    />
    <title>ResolveAI — Customer Experience Command Center</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!--
      Theme applied before first paint so there is no flash of the wrong theme.
      Reads an explicit choice from localStorage, else follows the OS setting.
      Wrapped in try/catch: private mode and blocked site data both throw here.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('resolveai-theme');
          var dark =
            stored === 'dark' ||
            (stored !== 'light' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {
          /* storage unavailable — fall through to the CSS media default */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!--
      Boot watchdog.

      A single-page app whose entry chunk fails to load renders nothing at all:
      no error, no message, just a white page. The usual cause is a browser
      holding a cached index.html after a redeploy — it asks for a hashed chunk
      that no longer exists, gets a 404, and React never mounts.

      If #root is still empty after 12 seconds, say so and offer a
      cache-busting reload rather than leaving a blank screen.
    -->
    <script>
      (function () {
        var GRACE_MS = 12000;
        function mounted() {
          var r = document.getElementById('root');
          return r && r.children.length > 0;
        }
        function reload() {
          // location.reload(true) is ignored by modern browsers, so bust the
          // cache with a query parameter instead.
          var u = new URL(window.location.href);
          u.searchParams.set('_r', Date.now());
          window.location.replace(u.toString());
        }
        setTimeout(function () {
          if (mounted()) return;
          document.getElementById('root').innerHTML =
            '<div style="min-height:100dvh;display:flex;align-items:center;justify-content:center;' +
            'font-family:Archivo,system-ui,sans-serif;background:#08090a;color:#f3f2f2;padding:24px">' +
            '<div style="max-width:26rem;text-align:center">' +
            '<div style="display:flex;gap:4px;justify-content:center;margin-bottom:20px">' +
            '<span style="width:26px;height:6px;background:#f3f2f2;display:block"></span>' +
            '<span style="width:38px;height:6px;background:#f3f2f2;display:block"></span>' +
            '<span style="width:48px;height:6px;background:#ec3013;display:block"></span></div>' +
            '<h1 style="font-size:15px;font-weight:600;margin:0 0 8px">This page did not finish loading</h1>' +
            '<p style="font-size:13px;line-height:1.6;color:#9a9391;margin:0 0 18px">' +
            'Usually a cached copy of an older build. Reloading clears it.</p>' +
            '<button id="rai-reload" style="height:32px;padding:0 14px;border:0;border-radius:6px;' +
            'background:#d92a10;color:#fff;font:500 13px Archivo,system-ui,sans-serif;cursor:pointer">' +
            'Reload</button></div></div>';
          var b = document.getElementById('rai-reload');
          if (b) b.addEventListener('click', reload);
        }, GRACE_MS);
      })();
    </script>
  </body>
</html>
